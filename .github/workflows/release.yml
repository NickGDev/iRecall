# Release build: one self-contained artifact + the model bundle, never in git.
# - build job: fetches recall-models.tar.gz from the previous latest release
#   (re-attached to the new release, so the chain keeps propagating), compiles
#   the server + extension, and assembles Recall.app — bundled node runtime,
#   tray (swiftc), prod node_modules, models, unpacked extension. Users need no
#   node/npm/Xcode. Unsigned: Gatekeeper asks for right-click-open once.
# - model bundles are built by .github/workflows/models.yml (manual dispatch):
#   the tag-triggered heavy downloads were auto-cancelled by GitHub's abuse
#   detection on this new repo. Bump models: run models.yml, upload
#   recall-models.tar.gz to the latest release, then tag.
# - First-ever release: no models asset exists yet — build fails with a clear
#   fetch-models.sh error; run models.yml, upload to a draft release, re-tag.
# - No keys or secrets: CRX signing stays local (scripts/pack-extension.mjs);
#   the extension ships unpacked inside the app for Load-unpacked / repack.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch model bundle from previous latest release (or HF for granite)
        env:
          RECALL_REPO: ${{ github.repository }}
        run: bash scripts/fetch-models.sh
      - name: Build Recall.app
        run: bash scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: recall-app
          path: Recall-app-macos-arm64.zip
          retention-days: 3
          compression-level: 0

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: recall-app
      - name: Fetch model bundle for re-attachment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download -p 'recall-models.tar.gz' -O recall-models.tar.gz --clobber
      - run: |
          sha256sum Recall-app-macos-arm64.zip recall-models.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Attach artifacts to tag release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes \
              Recall-app-macos-arm64.zip recall-models.tar.gz SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
