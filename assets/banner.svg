<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2038"/>
      <stop offset="1" stop-color="#0a0b12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#5a6ee0" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#5a6ee0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <g transform="translate(560,60) scale(0.203)">
    <rect width="512" height="512" rx="112" fill="#141728" stroke="#ffffff" stroke-opacity="0.08" stroke-width="6"/>
    <text x="232" y="270" text-anchor="middle" dominant-baseline="central"
          font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
          font-size="250" font-weight="800" fill="#ffffff">iR</text>
    <circle cx="381" cy="136" r="34" fill="none" stroke="#3ddc97" stroke-opacity="0.35" stroke-width="6"/>
    <circle cx="381" cy="136" r="20" fill="#3ddc97"/>
  </g>

  <text x="640" y="330" text-anchor="middle"
        font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="120" font-weight="800" fill="#ffffff">iRecall</text>

  <text x="640" y="392" text-anchor="middle"
        font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="40" font-weight="500" fill="#ffffff" fill-opacity="0.78">A hippocampus for your browser history.</text>

  <g font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="600" fill="#c9cdf0">
    <rect x="181" y="466" width="212" height="60" rx="30" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="287" y="504" text-anchor="middle">100% local</text>
    <rect x="417" y="466" width="316" height="60" rx="30" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="575" y="504" text-anchor="middle">Private by design</text>
    <rect x="757" y="466" width="342" height="60" rx="30" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
