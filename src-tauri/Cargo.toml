[package]
name = "irecall-tray"
version = "0.1.0"
description = "iRecall menu-bar tray + local server supervisor"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde_json = "1"
# Loopback-only traffic: no TLS backend needed.
ureq = { version = "2", default-features = false, features = ["json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
